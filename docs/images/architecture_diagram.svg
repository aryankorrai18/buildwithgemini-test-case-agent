<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="background:#0d1117; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#a371f7" />
    </linearGradient>
    <linearGradient id="agentCard1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#1a2230" />
    </linearGradient>
    <linearGradient id="agentCard2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#18271e" />
    </linearGradient>
    <linearGradient id="agentCard3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#282218" />
    </linearGradient>
    <!-- Arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="arrowLoop" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f0883e" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950" />
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Title Section -->
  <text x="800" y="70" font-size="36" font-weight="bold" fill="url(#headerGrad)" text-anchor="middle">Test Case Generator Agent Architecture</text>
  <text x="800" y="110" font-size="18" fill="#8b949e" text-anchor="middle">Multi-Agent Autonomous QA Pipeline with Google ADK &amp; Gemini 2.5 Flash on Vertex AI</text>

  <!-- Step 1: Input -->
  <g transform="translate(60, 200)">
    <rect width="260" height="260" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2.5" />
    <rect x="20" y="20" width="100" height="30" rx="6" fill="#21262d" />
    <text x="70" y="40" font-size="12" font-weight="bold" fill="#8b949e" text-anchor="middle">INPUT</text>
    <text x="130" y="90" font-size="20" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Requirement / Story</text>
    <text x="130" y="130" font-size="14" fill="#8b949e" text-anchor="middle">Markdown / Text / User Story</text>
    <text x="130" y="160" font-size="13" fill="#7d8590" text-anchor="middle">• Functional Requirements</text>
    <text x="130" y="185" font-size="13" fill="#7d8590" text-anchor="middle">• Acceptance Criteria</text>
    <text x="130" y="210" font-size="13" fill="#7d8590" text-anchor="middle">• Authentication &amp; Limits</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="320" y1="330" x2="410" y2="330" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow)" />

  <!-- Step 2: Parser Agent -->
  <g transform="translate(420, 200)">
    <rect width="320" height="260" rx="16" fill="url(#agentCard1)" stroke="#1f6feb" stroke-width="2.5" />
    <rect x="20" y="20" width="130" height="30" rx="6" fill="#1f6feb" />
    <text x="85" y="40" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">ADK PARSER AGENT</text>
    <text x="160" y="90" font-size="20" font-weight="bold" fill="#58a6ff" text-anchor="middle">Requirement Analysis</text>
    <text x="160" y="130" font-size="14" fill="#c9d1d9" text-anchor="middle">Decomposes User Story into</text>
    <text x="160" y="155" font-size="14" fill="#c9d1d9" text-anchor="middle">Discrete Criteria Points</text>
    <rect x="30" y="180" width="260" height="45" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />
    <text x="160" y="208" font-size="13" font-family="monospace" fill="#79c0ff" text-anchor="middle">REQ-1, REQ-2 ... REQ-N</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="740" y1="330" x2="820" y2="330" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow)" />

  <!-- Step 3: Generator Agent -->
  <g transform="translate(830, 200)">
    <rect width="330" height="260" rx="16" fill="url(#agentCard2)" stroke="#238636" stroke-width="2.5" />
    <rect x="20" y="20" width="160" height="30" rx="6" fill="#238636" />
    <text x="100" y="40" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">ADK GENERATOR AGENT</text>
    <text x="165" y="90" font-size="20" font-weight="bold" fill="#3fb950" text-anchor="middle">Test Suite Synthesis</text>
    <text x="165" y="130" font-size="14" fill="#c9d1d9" text-anchor="middle">Crafts Full Test Scenarios</text>
    <g transform="translate(25, 160)">
      <rect x="0" y="0" width="85" height="35" rx="6" fill="#238636" fill-opacity="0.3" stroke="#238636" stroke-width="1.5" />
      <text x="42" y="22" font-size="12" font-weight="bold" fill="#3fb950" text-anchor="middle">POSITIVE</text>
      
      <rect x="95" y="0" width="85" height="35" rx="6" fill="#da3633" fill-opacity="0.3" stroke="#da3633" stroke-width="1.5" />
      <text x="137" y="22" font-size="12" font-weight="bold" fill="#f85149" text-anchor="middle">NEGATIVE</text>
      
      <rect x="190" y="0" width="85" height="35" rx="6" fill="#d29922" fill-opacity="0.3" stroke="#d29922" stroke-width="1.5" />
      <text x="232" y="22" font-size="12" font-weight="bold" fill="#e3b341" text-anchor="middle">EDGE</text>
    </g>
    <text x="165" y="235" font-size="12" fill="#8b949e" text-anchor="middle">Steps, Preconditions, Expected Results</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="1160" y1="330" x2="1240" y2="330" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow)" />

  <!-- Step 4: Reviewer Agent -->
  <g transform="translate(1250, 200)">
    <rect width="300" height="260" rx="16" fill="url(#agentCard3)" stroke="#d29922" stroke-width="2.5" />
    <rect x="20" y="20" width="150" height="30" rx="6" fill="#d29922" />
    <text x="95" y="40" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">ADK REVIEWER AGENT</text>
    <text x="150" y="90" font-size="20" font-weight="bold" fill="#e3b341" text-anchor="middle">Quality Gate Review</text>
    <text x="150" y="130" font-size="14" fill="#c9d1d9" text-anchor="middle">• Gap Detection &amp; Audit</text>
    <text x="150" y="155" font-size="14" fill="#c9d1d9" text-anchor="middle">• Deduplication Check</text>
    <text x="150" y="180" font-size="14" fill="#c9d1d9" text-anchor="middle">• Requirement Coverage %</text>
    <text x="150" y="215" font-size="13" font-weight="bold" fill="#f0883e" text-anchor="middle">Strict Coverage Validation</text>
  </g>

  <!-- Refinement Loop Box below -->
  <g transform="translate(830, 530)">
    <rect width="330" height="150" rx="16" fill="#1b1712" stroke="#f0883e" stroke-width="2" stroke-dasharray="6,6" />
    <text x="165" y="45" font-size="17" font-weight="bold" fill="#f0883e" text-anchor="middle">Self-Correction Feedback Loop</text>
    <text x="165" y="80" font-size="13" fill="#c9d1d9" text-anchor="middle">Iterates up to max_retries if uncovered points,</text>
    <text x="165" y="105" font-size="13" fill="#c9d1d9" text-anchor="middle">boundary gaps, or duplicate cases are found</text>
  </g>

  <!-- Loop Arrows -->
  <path d="M 1400 460 L 1400 605 L 1170 605" fill="none" stroke="#f0883e" stroke-width="2.5" marker-end="url(#arrowLoop)" />
  <text x="1350" y="585" font-size="13" font-weight="bold" fill="#f0883e">Gaps Detected</text>

  <path d="M 830 605 L 770 605 L 770 410 L 820 410" fill="none" stroke="#f0883e" stroke-width="2.5" marker-end="url(#arrowLoop)" />
  <text x="700" y="520" font-size="13" font-weight="bold" fill="#f0883e" text-anchor="middle">Refinement Turn</text>

  <!-- Pass Quality Gate Arrow -->
  <path d="M 1400 460 L 1400 710 L 1220 710" fill="none" stroke="#3fb950" stroke-width="3" marker-end="url(#arrowGreen)" />
  <text x="1405" y="660" font-size="13" font-weight="bold" fill="#3fb950">Quality Passed</text>

  <!-- Output Box -->
  <g transform="translate(420, 680)">
    <rect width="780" height="150" rx="16" fill="#161b22" stroke="#3fb950" stroke-width="2.5" />
    <rect x="25" y="20" width="150" height="30" rx="6" fill="#238636" />
    <text x="100" y="40" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">EXPORTED ARTIFACTS</text>
    <text x="420" y="45" font-size="18" font-weight="bold" fill="#f0f6fc">Production-Ready Multi-Format Test Suite</text>
    
    <g transform="translate(40, 75)">
      <rect x="0" y="0" width="210" height="50" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />
      <text x="105" y="28" font-size="14" font-weight="bold" fill="#58a6ff" text-anchor="middle">📁 test_cases.csv</text>
      <text x="105" y="44" font-size="10.5" fill="#8b949e" text-anchor="middle">Spreadsheet / Jira / TestRail</text>
    </g>

    <g transform="translate(285, 75)">
      <rect x="0" y="0" width="210" height="50" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />
      <text x="105" y="28" font-size="14" font-weight="bold" fill="#3fb950" text-anchor="middle">📄 test_cases.md</text>
      <text x="105" y="44" font-size="10.5" fill="#8b949e" text-anchor="middle">Markdown &amp; Coverage Summary</text>
    </g>

    <g transform="translate(530, 75)">
      <rect x="0" y="0" width="210" height="50" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />
      <text x="105" y="28" font-size="14" font-weight="bold" fill="#d29922" text-anchor="middle">📦 test_cases.json</text>
      <text x="105" y="44" font-size="10.5" fill="#8b949e" text-anchor="middle">CI/CD Pipeline Automation</text>
    </g>
  </g>

  <!-- Footer Info -->
  <text x="800" y="875" font-size="13" font-weight="bold" fill="#6e7681" text-anchor="middle">
    Engineered with Google Agent Development Kit (ADK) • Gemini 2.5 Flash on Vertex AI • Automated Self-Correction Loop
  </text>
</svg>
